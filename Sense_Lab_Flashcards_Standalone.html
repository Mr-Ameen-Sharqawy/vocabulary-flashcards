      ["senses","The five senses","الحواس الخمس","#f4c84a"],
      ["world","Words around us","كلمات من حولنا","#70c6b5"],
      ["safety","Safety & expressions","السلامة والعبارات","#f28c76"],
      ["verbs","Verb time machine","الأفعال والزمن الماضي","#9cb8e6"]
    ];
    let deck = [...data], current = 0, answers = {}, railOpen = false, flipped = false, heardWord = false;
    const hero = IMG("senses-safety-hero_e652dfff.jpg");
    const esc = (text) => String(text).replace(/[&<>"']/g, char => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[char]));
    function optionsFor(card) {
      const index = data.findIndex(item => item.id === card.id);
      const list = [card.term, ...[5,12,19].map(offset => data[(index+offset)%data.length].term)];
      const correct = list.shift(); list.splice(card.id % 4, 0, correct); return list;
    }
    function blankSentence(card){const escaped=card.term.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return card.example.replace(new RegExp(escaped,"i"),"_____")}
    function score(){return Object.entries(answers).filter(([id,answer]) => optionsFor(data.find(card => card.id === Number(id)))[answer] === data.find(card => card.id === Number(id)).term).length}
    function toast(message){const node=document.querySelector("#toast");node.textContent=message;node.classList.add("show");setTimeout(()=>node.classList.remove("show"),1800)}
    function speak(term){if(!window.speechSynthesis){toast("النطق التلقائي غير متاح في هذا المتصفح");return;}speechSynthesis.cancel();const voice=new SpeechSynthesisUtterance(term.replace(/[!?.]/g,""));voice.lang="en-US";voice.rate=.78;speechSynthesis.speak(voice)}
    function render(){
      const card = deck[current], options = optionsFor(card), sentence = blankSentence(card), selected = answers[card.id], answered = selected !== undefined, correct = answered && options[selected] === card.term, group = groups.find(item => item[0] === card.category), reviewed = Object.keys(answers).length;
      const nav = groups.map(([key,title,arabic,color]) => { const inGroup=deck.filter(item=>item.category===key); const done=inGroup.filter(item=>answers[item.id]!==undefined).length; return `<button data-go-group="${key}" class="${card.category===key?"active":""}"><i class="sl-dot" style="background:${color}"></i><label dir="ltr">${title}</label><small>${done}/${inGroup.length}</small></button>`; }).join("");
      const choices = options.map((option,index) => { const isCorrect=option===card.term, isSelected=selected===index; const css=answered?(isCorrect?"correct":isSelected?"wrong":"muted"):""; const symbol=answered&&isCorrect?"✓":answered&&isSelected?"×":""; return `<button class="sl-option ${css}" data-option="${index}" ${answered?"disabled":""}><span class="sl-letter">${String.fromCharCode(65+index)}</span><strong dir="ltr">${esc(option)}</strong><span class="sl-tick">${symbol}</span></button>`; }).join("");
      const reveal = answered ? `<section class="sl-answer ${correct?"good":"bad"}"><div class="sl-answer-icon">${correct?"✓":"×"}</div><div><p>${correct?"أحسنت! إجابة صحيحة.":"لا بأس، ثبّت الإجابة الصحيحة."}</p><h4>${esc(card.term)} <span>— ${esc(card.arabic)}</span></h4><p class="example">“${esc(card.example)}”</p></div></section>` : "";
      document.querySelector("#app").innerHTML = `
        <header class="sl-top"><div class="sl-brand"><div class="sl-logo" aria-hidden="true"></div><div><small>ENGLISH · GRADE SCHOOL</small><strong>Vocabulary Flashcards</strong></div></div><div class="sl-top-tools"><div class="sl-score">✓ <b>${score()}</b><span>/ ${reviewed} right</span></div><button class="sl-menu" data-menu aria-label="Open lesson menu">☰</button></div></header>
        <div class="sl-layout"><aside class="sl-rail ${railOpen?"open":""}"><button class="sl-close" data-menu aria-label="Close lesson menu">×</button><div class="sl-badge"><span>LESSON</span><b>02</b><em>Sense Lab</em></div><p class="sl-route">YOUR ROUTE</p><h1>الحواس<br>والسلامة</h1><p>بطاقات سريعة: اختَر المعنى، ثم ثبّت الكلمة بالصورة والجملة.</p><nav class="sl-nav">${nav}</nav><div class="sl-rail-bottom"><div class="sl-mini"><i style="width:${reviewed/deck.length*100}%"></i></div><p>${reviewed} من ${deck.length} بطاقة تمت مراجعتها</p></div></aside>
        <main class="sl-main"><section class="sl-hero"><img src="${hero}" alt="Illustration of the five senses"><div class="sl-hero-copy"><div class="sl-label">✦ Practice, don&apos;t just memorize</div><h2>اختَر المعنى.<br><span>ثبّت الكلمة.</span></h2><p>مراجعة تفاعلية لمفردات الحواس والسلامة، مع صورك وجمل قصيرة تساعد على التذكر.</p></div><div class="sl-photo-chip">▣ 31 picture-led cards</div></section>
        <section class="sl-progress"><div><p class="arabic">${group[2]}</p><p class="card-no">Card ${String(current+1).padStart(2,"0")} <span>of ${deck.length}</span></p></div><div class="sl-track"><i style="width:${(current+1)/deck.length*100}%"></i></div></section>
        <article class="sl-card"><section class="sl-flip ${flipped?"flipped":""}"><div class="sl-flip-inner"><div class="sl-face sl-front"><div class="sl-guess"><p>BEFORE YOU LISTEN</p><button class="sl-word-button ${heardWord?"ready":""}" data-word-click aria-label="${heardWord?`Reveal the picture for ${esc(card.term)} and hear it again`:`Listen to ${esc(card.term)}`}">${esc(card.term)}</button><small>${heardWord?"اضغط على الكلمة مرة ثانية لتكشف الصورة.":"اضغط على الكلمة لتسمع نطقها أولًا."}</small></div><span class="sl-guess-count">${String(current+1).padStart(2,"0")}</span></div><div class="sl-face sl-back"><img src="${card.image}" alt="Illustration for ${esc(card.term)}"><button class="sl-back-word" data-replay aria-label="Listen to ${esc(card.term)} again"><strong>${esc(card.term)}</strong><span>${esc(card.arabic)}</span></button></div></div></section><section class="sl-content"><div class="sl-card-top"><span class="sl-part">${esc(card.part)}</span></div><p class="sl-question">Complete the sentence</p><p dir="ltr" style="margin:7px 0 5px;color:#0f2d4c;font:800 clamp(20px,2.5vw,28px)/1.35 'Nunito Sans',sans-serif;letter-spacing:-.03em">${esc(sentence)}</p><p class="sl-hint">اختر الكلمة التي تُكمل الجملة.</p><div class="sl-options">${choices}</div>${reveal}</section></article>
        <section class="sl-controls"><button class="sl-button sl-secondary" data-shuffle>⤨ ابدأ ترتيبًا عشوائيًا</button><div class="sl-arrows"><button class="sl-button sl-small" data-prev ${current===0?"disabled":""} aria-label="Previous card">‹</button><button class="sl-button sl-primary" data-next ${current===deck.length-1?"disabled":""}>Next card ›</button><button class="sl-button sl-small" data-reset aria-label="Reset deck">↻</button></div></section></main></div>`;
      document.querySelectorAll("[data-option]").forEach(button => button.addEventListener("click", () => { answers[card.id]=Number(button.dataset.option); render(); }));
      document.querySelector("[data-next]").addEventListener("click",()=>{if(current<deck.length-1){current++;flipped=false;heardWord=false;render();}});
      document.querySelector("[data-prev]").addEventListener("click",()=>{if(current>0){current--;flipped=false;heardWord=false;render();}});
      document.querySelector("[data-reset]").addEventListener("click",()=>{deck=[...data];current=0;answers={};flipped=false;heardWord=false;toast("تمت إعادة البطاقات من البداية");render();});
      document.querySelector("[data-shuffle]").addEventListener("click",()=>{deck=[...data].sort(()=>Math.random()-.5);current=0;answers={};flipped=false;heardWord=false;toast("تم ترتيب البطاقات عشوائيًا");render();});
      document.querySelectorAll("[data-go-group]").forEach(button=>button.addEventListener("click",()=>{const index=deck.findIndex(item=>item.category===button.dataset.goGroup);if(index>=0){current=index;flipped=false;heardWord=false;railOpen=false;render();}}));
      document.querySelectorAll("[data-menu]").forEach(button=>button.addEventListener("click",()=>{railOpen=!railOpen;render();}));
      document.querySelector("[data-word-click]").addEventListener("click",()=>{if(!heardWord){heardWord=true;render();speak(card.term);return;}speak(card.term);flipped=true;render();});
      document.querySelector("[data-replay]").addEventListener("click",()=>speak(card.term));
    }
    render();
  </script>
</body>
</html>
